[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  targetPort = 8080

[functions]
  external_node_modules = ["@supabase/supabase-js"]
  # Increase timeout for image generation (gptimage model takes 20-40+ seconds)
  # Note: Free tier has 10s limit, Pro tier allows up to 26s, Enterprise allows 60s
  # If on free tier, this won't help - need to upgrade or use faster model

[functions."generate-image"]
  # Set maximum timeout for image generation function
  # This requires Netlify Pro plan or higher for timeouts > 10 seconds
  timeout = 60

# SEO Redirects - enforce HTTPS and canonical domain
[[redirects]]
  from = "http://bexyflowers.shop/*"
  to = "https://bexyflowers.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bexyflowers.shop/*"
  to = "https://bexyflowers.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bexyflowers.shop/*"
  to = "https://bexyflowers.shop/:splat"
  status = 301
  force = true

# Trailing slash redirect (optional - enforce consistency)
# Uncomment if you want to enforce trailing slashes
# [[redirects]]
#   from = "/*/"
#   to = "/:splat"
#   status = 301

# Database API: rewrite so /api/database hits Netlify function (fixes 404 when client uses /api/database)
[[redirects]]
  from = "/api/database"
  to = "/.netlify/functions/database"
  status = 200
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── HTTP Cache-Control Headers ───────────────────────────────────────────────
# Hashed JS/CSS bundles (filename contains content hash → safe to cache forever)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts cached 1 year
[[headers]]
  for = "/assets/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public images — 30 days, revalidate in background
[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Videos — 30 days cache + streaming support
# Accept-Ranges lets browsers stream video with partial content requests (HTTP 206)
# This means playback starts without downloading the full file
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    Accept-Ranges = "bytes"

# Service worker — must never be cached (always fetch fresh)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# manifest.json — short cache so PWA updates quickly
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML document — short cache so deployments propagate fast
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

